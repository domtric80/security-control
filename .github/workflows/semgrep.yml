name: Semgrep PHP Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Analyze PHP with Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.174.0"

      - name: Run Semgrep
        run: |
          semgrep scan webapp \
            --config p/php \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --exclude-rule php.lang.security.injection.echoed-request.echoed-request \
            --sarif \
            --output semgrep.sarif \
            --metrics=off \
            --error \
            --exclude webapp/public/uploads \
            --exclude .git

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: semgrep.sarif
