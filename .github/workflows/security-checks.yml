name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "21 3 * * 1"

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, ldap, zip, mbstring, curl, dom, xml, fileinfo
          coverage: none

      - name: Lint PHP files
        run: |
          find webapp -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n 1 php -l

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose file
        run: docker compose config

      - name: Build PHP image
        run: docker build -f docker/php/Dockerfile .
