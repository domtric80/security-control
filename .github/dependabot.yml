version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/docker/php"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
