version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: "/docker/php"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: php
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    labels:
      - dependencies
      - docker
